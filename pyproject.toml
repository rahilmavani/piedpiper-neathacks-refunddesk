[project]
name = "refunddesk"
version = "0.1.0"
description = "RefundDesk: a demo customer-support agent for refunds, with a deterministic eval suite"
authors = [
    { name = "rahilmavani", email = "mavanirahil6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
refunddesk = "refunddesk:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
